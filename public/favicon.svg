<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="24" fill="#0A0A0F" stroke="url(#gradient)" stroke-width="2"/>
  
  <!-- Stylized A -->
  <path d="M50 22 L82 82 L64 82 L50 52 L36 82 L18 82 Z" fill="url(#gradient)" filter="url(#glow)"/>
  
  <!-- AI dot / node -->
  <circle cx="50" cy="38" r="4" fill="#0A0A0F"/>
  <circle cx="50" cy="62" r="3" fill="url(#gradient)"/>
</svg>